<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <title>Live Counter | Dark mode</title>
</head>
<body>
    <main class="box">
      <h1>Note counter</h1>

      <label for="note-text">Write your note</label>
      <textarea  id="note-text" rows="5" placeholder="Start typing..."></textarea>

      <p id="char-count"></p>
      <p id="word-count"></p>
      <button id="clear-btn">Clear</button>
      <button id="theme-toggle">Theme</button>
    </main>
</body>
</html>
